<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Swap Chess</title>
<link rel="stylesheet" href="../src/styles.css">
</head>
<body data-variants="randomswap">
<main>
  <section id="lobby">
    <h1>Random Swap Chess</h1>
    <p class="sub">Classic 8×8 chess, except the piece you move swaps type with another of your pieces at random.</p>
    <div class="card">
      <div id="variant-field">
        <label for="pick-variant">Variant</label>
        <select id="pick-variant"></select>
      </div>
      <label for="pick-color">You play</label>
      <select id="pick-color">
        <option value="w">White</option>
        <option value="b">Black</option>
        <option value="r">Random</option>
      </select>
      <label class="check" id="castle-field" for="opt-castling">
        <input type="checkbox" id="opt-castling">
        <span>Allow castling<small>King moves two squares toward a rook; the rook lands on the square the king crossed.</small></span>
      </label>
      <div class="row">
        <button class="btn primary" id="create" type="button">Create online game</button>
        <button class="btn" id="local" type="button">Play on this device</button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <span id="variant"></span>
      <span id="link" class="pill wait" hidden></span>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="note" hidden></div>
    <div id="board"></div>
    <div id="turn" class="turn" hidden>
      <button class="btn" id="turn-left" type="button" aria-label="Turn the board left">◀</button>
      <span>Turn the cylinder</span>
      <button class="btn" id="turn-right" type="button" aria-label="Turn the board right">▶</button>
    </div>
    <div id="promo" hidden></div>

    <div id="invite" class="card" hidden>
      <p>Send this link to your opponent. Keep this tab open — your browser is the game host.</p>
      <input id="invite-url" type="text" readonly aria-label="Invite link">
      <button class="btn primary" id="copy" type="button">Copy link</button>
    </div>

    <div class="row actions">
      <button class="btn" id="resign" type="button">Resign</button>
      <button class="btn primary" id="rematch" type="button" hidden>Rematch (swap colours)</button>
      <a class="btn" href="?" style="text-decoration:none;text-align:center">New game</a>
    </div>
    <ol id="moves" aria-label="Moves"></ol>
  </section>
</main>
<script src="../vendor/peerjs-1.5.5.min.js"></script>
<script type="module" src="../src/main.js"></script>
</body>
</html>
